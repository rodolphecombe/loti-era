#textdomain wesnoth-loti-era
[unit_type]
    id=Merman Brawler LotI
	[base_unit]
		id=Merman Brawler
    [/base_unit]
	hide_help=true
    do_not_list=yes
	experience=50
	{GENERIC_AMLA units/merfolk/brawler.png units/merfolk/brawler-defend.png units/merfolk/brawler-defend.png units/merfolk/brawler.png units/merfolk/brawler-defend.png units/merfolk/brawler-defend.png (
	[advancement]
			id=slow
			max_times=1
			description= _ "stunning enemies better"
			image=attacks/sling.png
			strict_amla=yes
			require_amla="better1,better1"
			[effect]
				apply_to=attack
				name=tail-merman
				[set_specials]
					mode=replace
					{WEAPON_SPECIAL_SLOW}
				[/set_specials]
			[/effect]
			{AMLA_DEFAULT_BONUSES}
		[/advancement]
		[advancement]
			max_times=1
			always_display=yes
			id=berserk
			description= _ "able to enter a battle frenzy like dwarves, but only when attacking (new attack)"
			image=attacks/frenzy.png
			strict_amla=yes
			require_amla="better0"
			[effect]
				apply_to=new_attack
				name="fist_berserk"
				description= _ "frenzy"
				icon=attacks/frenzy.png
				type=impact
				range=melee
				defense_weight=0
				[specials]
					{WEAPON_SPECIAL_LESSER_BERSERK_LOTI 3}
				[/specials]
				damage=2
				number=6
			[/effect]
			{AMLA_DEFAULT_BONUSES}
		[/advancement]
		[advancement]
			max_times=1
			always_display=yes
			id=horrid
			description= _ "able to attack in a terribly scary way (new attack)"
			image=attacks/wail.png
			strict_amla=yes
			require_amla=""
			[effect]
				apply_to=bonus_attack
				name=grim strike
				description= _ "grim strike"
				icon=attacks/wail.png
				range=melee
				damage=-20
				clone_anim=yes
				[specials]
					{WEAPON_SPECIAL_HORRID_LOTI}
				[/specials]
			[/effect]
			{AMLA_DEFAULT_BONUSES}
		[/advancement]
		[advancement]
			id=armour
			max_times=5
			description= _ "better protected from physical blows (2% better resistances)"
			image=icons/steel_armor.png
			strict_amla=yes
			require_amla=""
			[effect]
				apply_to=resistance
				replace=false
				[resistance]
					blade=-2
					pierce=-2
					impact=-2
				[/resistance]
			[/effect]
			{AMLA_DEFAULT_BONUSES}
		[/advancement]
		[advancement]
			max_times=3
			always_display=yes
			id=movement
			description= _ "faster"
			image=icons/boots_elven.png
			strict_amla=yes
			require_amla=""
			[effect]
				apply_to=movement
				increase=1
			[/effect]
			{AMLA_DEFAULT_BONUSES}
		[/advancement]
	) "Merman Brawler LotI"}
[/unit_type]